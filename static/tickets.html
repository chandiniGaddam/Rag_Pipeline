<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT HelpDesk Tickets</title>
<style>
  :root { --bg:#f4f6fb; --panel:#fff; --text:#1c2333; --muted:#6b7388; --accent:#2f5bea; --accent-text:#fff;
          --border:#dde2ee; --open:#c77700; --prog:#2f5bea; --done:#2e7d32; --high:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#11141c; --panel:#1a1f2b; --text:#e6e9f2; --muted:#8d95ab; --accent:#5b82ff; --accent-text:#0b0e16;
            --border:#2c3345; --open:#f0a53a; --prog:#7a9bff; --done:#66bb6a; --high:#ef6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  a.link { color:var(--accent); text-decoration:none; font-size:14px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .toolbar button, select { padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--panel);
                            color:var(--text); cursor:pointer; font:inherit; font-size:13.5px; }
  .toolbar button.on { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
  .id { font-weight:700; } .title { margin:4px 0 8px; }
  .meta { color:var(--muted); font-size:13px; display:flex; gap:14px; flex-wrap:wrap; }
  .badge { font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; border:1px solid currentColor; }
  .open{color:var(--open)} .in_progress{color:var(--prog)} .resolved{color:var(--done)} .p-high{color:var(--high)}
  details { margin-top:10px; font-size:14px; } summary { cursor:pointer; color:var(--accent); }
  details p { margin:6px 0; white-space:pre-wrap; } .k { color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .count { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎫 IT HelpDesk Tickets <span class="count" id="count"></span></h1>
    <a class="link" href="/">← Back to assistant</a>
  </header>
  <div class="toolbar" id="filters"></div>
  <div id="list"></div>
</div>
<script>
const FILTERS = [["all","All"],["open","Open"],["in_progress","In progress"],["resolved","Resolved"]];
const LABEL = { open:"Open", in_progress:"In progress", resolved:"Resolved" };
let tickets = [], filter = "all";

function mk(tag, props = {}, ...kids) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...kids);
  return el;
}

function renderFilters() {
  document.getElementById("filters").replaceChildren(...FILTERS.map(([k, label]) =>
    mk("button", { type:"button", className: k === filter ? "on" : "", textContent: label,
                   onclick: () => { filter = k; render(); } })));
}

function render() {
  renderFilters();
  const shown = tickets.filter(t => filter === "all" || t.status === filter);
  document.getElementById("count").textContent = `(${shown.length} of ${tickets.length})`;
  const list = document.getElementById("list");
  if (!shown.length) { list.replaceChildren(mk("div", { className:"empty", textContent:"No tickets yet." })); return; }

  list.replaceChildren(...shown.map(t => {
    const select = mk("select", { onchange: e => setStatus(t.ticket_id, e.target.value) },
      ...Object.entries(LABEL).map(([v, l]) => mk("option", { value:v, textContent:l, selected: v === t.status })));
    const who = t.requester || {};
    return mk("div", { className:"card" },
      mk("div", { className:"top" },
        mk("span", { className:"id", textContent: t.ticket_id }),
        mk("span", {},
          mk("span", { className:`badge p-${t.priority}`, textContent: `${t.priority} priority` }), " ",
          mk("span", { className:`badge ${t.status}`, textContent: LABEL[t.status] || t.status }), " ", select)),
      mk("div", { className:"title", textContent: t.title }),
      mk("div", { className:"meta" },
        mk("span", { textContent: new Date(t.created_at).toLocaleString() }),
        mk("span", { textContent: `👤 ${who.name || "—"}${who.email ? " · " + who.email : ""}` }),
        mk("span", { textContent: `📚 ${(t.sources || []).join(", ") || "no sources"}` })),
      mk("details", {}, mk("summary", { textContent:"Details" }),
        mk("p", {}, mk("span", { className:"k", textContent:"Question: " }), t.question),
        mk("p", {}, mk("span", { className:"k", textContent:"Assistant answer: " }), t.assistant_answer || "—"),
        mk("p", {}, mk("span", { className:"k", textContent:"Notes: " }), t.details || "—")));
  }));
}

async function load() {
  try {
    const res = await fetch("/api/tickets");
    if (!res.ok) throw new Error(res.status);
    tickets = (await res.json()).tickets;
    render();
  } catch (e) { /* keep the last good view; retry on next poll */ }
}

async function setStatus(id, status) {
  await fetch(`/api/tickets/${encodeURIComponent(id)}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
  load();
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
