<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT HelpDesk Assistant</title>
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --text: #1c2333; --muted: #6b7388;
    --accent: #2f5bea; --accent-text: #ffffff; --user: #2f5bea; --bot: #eef1f8;
    --border: #dde2ee; --chip: #e3e9fb; --error: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141c; --panel: #1a1f2b; --text: #e6e9f2; --muted: #8d95ab;
      --accent: #5b82ff; --accent-text: #0b0e16; --user: #3b5fd6; --bot: #252b3a;
      --border: #2c3345; --chip: #2a3350; --error: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 820px; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-text);
          display: grid; place-items: center; font-weight: 700; }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 0; font-size: 12.5px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { color: var(--error); }
  .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; color: var(--text); }
  .ticket-prompt { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .ticket-prompt p { margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
         color: var(--text); cursor: pointer; font-size: 13.5px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .ticket-form { display: grid; gap: 8px; margin-top: 4px; }
  .ticket-form input, .ticket-form textarea, .ticket-form select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font: inherit; font-size: 14px; }
  .ticket-form textarea { resize: vertical; min-height: 60px; }
  .ticket-done { font-weight: 600; }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .suggestions { padding: 0 20px 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .suggestions button { background: var(--bg); border: 1px solid var(--border); color: var(--text);
                        border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .suggestions button:hover { border-color: var(--accent); }
  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
  input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
          background: var(--bg); color: var(--text); font-size: 15px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button.send { padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text);
                font-weight: 600; cursor: pointer; font-size: 15px; }
  button:disabled, input:disabled { opacity: .55; cursor: not-allowed; }
  @media (max-width: 600px) { .app { border: 0; } .msg { max-width: 92%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">IT</div>
    <div>
      <h1>IT HelpDesk Assistant</h1>
      <p>Answers come only from the company knowledge base</p>
    </div>
    <a href="/tickets" style="margin-left:auto;color:var(--accent);text-decoration:none;font-size:14px">🎫 View tickets</a>
  </header>

  <div id="chat" aria-live="polite">
    <div class="msg bot">Hi! Ask me about password resets, VPN troubleshooting, application access and more.</div>
  </div>

  <div class="suggestions" id="suggestions">
    <button type="button">How do I reset my password?</button>
    <button type="button">VPN won't connect, what should I check?</button>
    <button type="button">How do I request application access?</button>
  </div>

  <form id="form">
    <input id="q" autocomplete="off" placeholder="Ask an IT support question…" aria-label="Question" autofocus>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");

function addMsg(text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addSources(el, sources) {
  if (!sources || !sources.length) return;
  const wrap = document.createElement("div");
  wrap.className = "sources";
  wrap.append("Sources:");
  [...new Set(sources.map(s => s.source))].forEach(name => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = name;
    wrap.appendChild(chip);
  });
  el.appendChild(wrap);
}

function mk(tag, props = {}, ...kids) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...kids);
  return el;
}

// Asks the user whether a ticket should be created; only then shows the form and calls the webhook.
function addTicketPrompt(el, output) {
  const noAnswer = output.sources.length === 0;
  const box = mk("div", { className: "ticket-prompt" });
  el.appendChild(box);

  const showAsk = () => {
    box.replaceChildren(
      mk("p", {}, noAnswer
        ? "I couldn't find this in the knowledge base. Would you like me to create a support ticket?"
        : "Is your issue still unresolved? Would you like me to create a support ticket?"),
      mk("div", { className: "row" },
        mk("button", { className: "btn primary", type: "button", textContent: "Yes, create a ticket", onclick: showForm }),
        mk("button", { className: "btn", type: "button", textContent: "No, thanks", onclick: () => box.remove() }))
    );
    chat.scrollTop = chat.scrollHeight;
  };

  const showForm = () => {
    const name = mk("input", { placeholder: "Your name" });
    const email = mk("input", { type: "email", placeholder: "Your email" });
    const details = mk("textarea", { placeholder: "Anything else we should know? (optional)" });
    const priority = mk("select", {}, ...["low", "medium", "high"].map(p =>
      mk("option", { value: p, textContent: "Priority: " + p, selected: p === "medium" })));
    const submit = mk("button", { className: "btn primary", type: "submit", textContent: "Create ticket" });
    const cancel = mk("button", { className: "btn", type: "button", textContent: "Cancel", onclick: showAsk });
    const form = mk("form", { className: "ticket-form" }, name, email, priority, details,
      mk("div", { className: "row" }, submit, cancel));
    form.style.padding = "0"; form.style.border = "0";

    form.addEventListener("submit", async e => {
      e.preventDefault();
      submit.disabled = true; submit.textContent = "Creating…";
      try {
        const res = await fetch("/api/tickets", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: output.question, answer: output.answer,
            sources: [...new Set(output.sources.map(s => s.source))],
            name: name.value.trim(), email: email.value.trim(),
            details: details.value.trim(), priority: priority.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `Server returned ${res.status}`);
        box.replaceChildren(mk("div", { className: "ticket-done",
          textContent: `✅ Ticket ${data.ticket_id} created. The IT team will follow up.` }));
      } catch (err) {
        submit.disabled = false; submit.textContent = "Create ticket";
        form.appendChild(mk("div", { className: "msg error", textContent: "Could not create ticket: " + err.message }));
      }
      chat.scrollTop = chat.scrollHeight;
    });

    box.replaceChildren(mk("p", {}, "Please confirm your details:"), form);
    name.focus();
    chat.scrollTop = chat.scrollHeight;
  };

  showAsk();
}

async function ask(question) {
  addMsg(question, "user");
  const pending = addMsg("", "bot");
  pending.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  input.disabled = send.disabled = true;
  try {
    // LangServe protocol: POST {"input": ...} to /<path>/invoke, response is {"output": ...}
    const res = await fetch("/helpdesk/invoke", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: { question } }),
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const { output } = await res.json();
    pending.textContent = output.answer;
    addSources(pending, output.sources);
    addTicketPrompt(pending, output);
  } catch (err) {
    pending.textContent = "Sorry, something went wrong: " + err.message;
    pending.classList.add("error");
  } finally {
    input.disabled = send.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  ask(q);
});

document.querySelectorAll("#suggestions button").forEach(b =>
  b.addEventListener("click", () => ask(b.textContent)));
</script>
</body>
</html>
